name: studytube

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    container_name: studytube-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - postgres_data
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  valkey:
    image: valkey/valkey:9.1.1-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
    container_name: studytube-valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - valkey_data
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: studytube-caddy
    restart: "no"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      - edge
    group_add:
      - "${STUDYTUBE_API_SOCKET_GID:-0}"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    environment:
      STUDYTUBE_SITE_ADDRESS: "${STUDYTUBE_SITE_ADDRESS:?STUDYTUBE_SITE_ADDRESS is required}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/www/studytube:/var/www/studytube:ro
      - /run/studytube:/run/studytube:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp

volumes:
  pgdata:
  valkeydata:
  caddy_data:
  caddy_config:

networks:
  edge:
    driver: bridge
  postgres_data:
    driver: bridge
  valkey_data:
    driver: bridge
