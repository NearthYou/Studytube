name: CI/CD

on:
  pull_request:
    branches:
      - main
      - sw
    paths:
      - "siwon/**"
      - ".github/workflows/ci-cd.yml"
  push:
    branches:
      - main
      - sw
    paths:
      - "siwon/**"
      - ".github/workflows/ci-cd.yml"
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: siwon/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: siwon/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: cd ../.. && node --test siwon/web/tests/*.test.ts

      - name: Build
        run: npm run build

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: siwon/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: siwon/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

  ai:
    name: AI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: siwon/ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: siwon/ai/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Test
        run: python -m unittest discover -s .

  deploy:
    name: Deploy EC2
    runs-on: ubuntu-latest
    needs:
      - web
      - api
      - ai
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/sw')
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
      EC2_REPO_DIR: ${{ secrets.EC2_REPO_DIR }}
      DEPLOY_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Prepare deployment config
        id: deploy-config
        run: |
          echo "EC2_HOST=${EC2_HOST:-15.164.98.162}" >> "$GITHUB_ENV"
          echo "EC2_USER=${EC2_USER:-ubuntu}" >> "$GITHUB_ENV"

          if [ -z "$EC2_SSH_KEY" ]; then
            echo "::notice::EC2_SSH_KEY is not configured, so deployment was skipped."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        if: steps.deploy-config.outputs.deploy == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy application
        if: steps.deploy-config.outputs.deploy == 'true'
        run: |
          REPO_DIR="${EC2_REPO_DIR:-/home/ubuntu/agentic-board}"
          APP_DIR="${EC2_APP_DIR:-$REPO_DIR/siwon}"
          ssh "$EC2_USER@$EC2_HOST" "REPO_DIR='$REPO_DIR' APP_DIR='$APP_DIR' DEPLOY_BRANCH='$DEPLOY_BRANCH' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$REPO_DIR"
          git fetch origin "$DEPLOY_BRANCH"
          git checkout "$DEPLOY_BRANCH"
          git pull --ff-only origin "$DEPLOY_BRANCH"
          cd "$APP_DIR"
          APP_DIR="$APP_DIR" DEPLOY_BRANCH="$DEPLOY_BRANCH" bash scripts/deploy-ec2.sh "$DEPLOY_BRANCH"
          REMOTE
