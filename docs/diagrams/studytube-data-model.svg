<g><rect x="40" y="130" width="340" height="220" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><path d="M40 210H380" stroke="#cbd5e1"/><text x="58" y="162" class="name">users</text><text x="58" y="191" class="sub">사용자 계정</text><text x="58" y="238" class="field">PK id</text><text x="58" y="265" class="field">email</text><text x="58" y="292" class="field">preferences</text></g>
<g><rect x="470" y="130" width="340" height="220" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><path d="M470 210H810" stroke="#cbd5e1"/><text x="488" y="162" class="name">learning_items</text><text x="488" y="191" class="sub">사용자별 영상 등록</text><text x="488" y="238" class="field">PK id</text><text x="488" y="265" class="field">FK user_id</text><text x="488" y="292" class="field">FK video_source_id</text><text x="488" y="319" class="field">UNIQUE (user_id, video_source_id)</text></g>
<g><rect x="900" y="130" width="340" height="220" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><path d="M900 210H1240" stroke="#cbd5e1"/><text x="918" y="162" class="name">video_sources</text><text x="918" y="191" class="sub">중복 없이 저장한 영상</text><text x="918" y="238" class="field">PK id</text><text x="918" y="265" class="field">provider</text><text x="918" y="292" class="field">canonical_video_id</text><text x="918" y="319" class="field">UNIQUE (provider, canonical_video_id)</text></g>
<g><rect x="40" y="430" width="340" height="220" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><path d="M40 510H380" stroke="#cbd5e1"/><text x="58" y="462" class="name">courses</text><text x="58" y="491" class="sub">사용자가 저장한 코스</text><text x="58" y="538" class="field">PK id</text><text x="58" y="565" class="field">FK owner_id</text><text x="58" y="592" class="field">status / visibility</text><text x="58" y="619" class="field">version</text></g>
<g><rect x="470" y="430" width="340" height="250" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><path d="M470 510H810" stroke="#cbd5e1"/><text x="488" y="462" class="name">study_contexts</text><text x="488" y="491" class="sub">단독 학습 또는 코스 학습</text><text x="488" y="538" class="field">PK id</text><text x="488" y="565" class="field">FK user_id</text><text x="488" y="592" class="field">FK learning_item_id (+ user_id)</text><text x="488" y="619" class="field">FK course_step_id (nullable)</text><text x="488" y="646" class="field">kind</text></g>
<g><rect x="900" y="430" width="340" height="250" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><path d="M900 510H1240" stroke="#cbd5e1"/><text x="918" y="462" class="name">caption_artifacts</text><text x="918" y="491" class="sub">영상별 자막 버전</text><text x="918" y="538" class="field">PK id</text><text x="918" y="565" class="field">FK video_source_id</text><text x="918" y="592" class="field">FK parent_artifact_id (nullable)</text><text x="918" y="619" class="field">kind / generation</text><text x="918" y="646" class="field">source_language / target_language</text></g>
<g><rect x="40" y="760" width="340" height="220" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><path d="M40 840H380" stroke="#cbd5e1"/><text x="58" y="792" class="name">course_steps</text><text x="58" y="821" class="sub">코스에 담긴 영상과 순서</text><text x="58" y="868" class="field">PK id</text><text x="58" y="895" class="field">FK course_id</text><text x="58" y="922" class="field">FK video_source_id (nullable)</text><text x="58" y="949" class="field">position / title_snapshot</text></g>
<g><rect x="470" y="760" width="340" height="220" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><path d="M470 840H810" stroke="#cbd5e1"/><text x="488" y="792" class="name">learning_notes</text><text x="488" y="821" class="sub">학습별 시점 메모</text><text x="488" y="868" class="field">PK id</text><text x="488" y="895" class="field">FK study_context_id (+ user_id)</text><text x="488" y="922" class="field">position_seconds</text><text x="488" y="949" class="field">body</text></g>
<g><rect x="900" y="760" width="340" height="220" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><path d="M900 840H1240" stroke="#cbd5e1"/><text x="918" y="792" class="name">learning_progress</text><text x="918" y="821" class="sub">사용자별 코스 진도</text><text x="918" y="868" class="field">PK id</text><text x="918" y="895" class="field">FK user_id / course_step_id</text><text x="918" y="922" class="field">FK study_context_id (nullable)</text><text x="918" y="949" class="field">UNIQUE (user_id, course_step_id)</text></g>
<text x="40" y="1015" class="note">주요 관계만 표시했습니다. course_steps의 영상 참조와 자막의 자기 참조 등은 상세 표에 정리했습니다.</text>
<text x="40" y="1043" class="note">standalone은 learning_item당 1개, course_occurrence는 사용자와 course_step 조합당 1개입니다.</text>
</svg>
