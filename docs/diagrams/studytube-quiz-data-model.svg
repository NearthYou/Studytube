<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1120" viewBox="0 0 1320 1120" role="img" aria-labelledby="title desc">
<title id="title">StudyTube 퀴즈 데이터</title><desc id="desc">퀴즈 실행마다 출제에 사용한 학습 기록과 자막 버전을 저장합니다. PK: 기본 키 / FK: 외래 키</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Malgun Gothic','Noto Sans KR',sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#526174}.name{font:700 21px Consolas,monospace}.field{font:15px Consolas,monospace}.label{font-size:16px;fill:#475569;paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round}.note{font-size:17px;fill:#475569}</style>
<rect width="1320" height="1120" fill="white"/><text x="40" y="48" class="title">StudyTube 퀴즈 데이터</text><text x="40" y="82" class="sub">퀴즈 실행마다 출제에 사용한 학습 기록과 자막 버전을 저장합니다. PK: 기본 키 / FK: 외래 키</text>
