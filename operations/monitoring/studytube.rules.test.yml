rule_files:
  - studytube.rules.yml

evaluation_interval: 1m

tests:
  - name: outbox backlog becomes pending, fires, and resolves
    interval: 1m
    input_series:
      - series: 'studytube_outbox_oldest_age_seconds{job="studytube-api",instance="api-1"}'
        values: '130 130 130 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: StudyTubeOutboxBacklogOld
        exp_alerts: []
      - eval_time: 2m
        alertname: StudyTubeOutboxBacklogOld
        exp_alerts:
          - exp_labels:
              alertname: StudyTubeOutboxBacklogOld
              instance: api-1
              job: studytube-api
              service: studytube
              severity: warning
            exp_annotations:
              summary: StudyTube outbox delivery is delayed
              action: Inspect the outbox relay and oldest pending event before replaying work.
      - eval_time: 3m
        alertname: StudyTubeOutboxBacklogOld
        exp_alerts: []

  - name: outbox counters become pending, fire, and age out
    interval: 1m
    input_series:
      - series: 'studytube_outbox_failures_total{job="studytube-api",instance="api-1",event_type="video_asset.requested"}'
        values: '0 1 1 1 1 1 1 1'
      - series: 'studytube_outbox_poison_total{job="studytube-api",instance="api-1",event_type="video_asset.requested"}'
        values: '0 1 1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: StudyTubeOutboxProcessingFailures
        exp_alerts: []
      - eval_time: 2m
        alertname: StudyTubeOutboxProcessingFailures
        exp_alerts:
          - exp_labels:
              alertname: StudyTubeOutboxProcessingFailures
              event_type: video_asset.requested
              instance: api-1
              job: studytube-api
              service: studytube
              severity: warning
            exp_annotations:
              summary: StudyTube outbox processing failed
              action: Inspect bounded event-type metrics and sanitized worker logs.
      - eval_time: 6m
        alertname: StudyTubeOutboxProcessingFailures
        exp_alerts: []
      - eval_time: 1m
        alertname: StudyTubeOutboxPoisonedEvent
        exp_alerts: []
      - eval_time: 2m
        alertname: StudyTubeOutboxPoisonedEvent
        exp_alerts:
          - exp_labels:
              alertname: StudyTubeOutboxPoisonedEvent
              event_type: video_asset.requested
              instance: api-1
              job: studytube-api
              service: studytube
              severity: critical
            exp_annotations:
              summary: StudyTube moved an outbox event to dead-letter storage
              action: Keep automatic replay disabled until the failure is classified.
      - eval_time: 6m
        alertname: StudyTubeOutboxPoisonedEvent
        exp_alerts: []

  - name: database pool waiters become pending, fire, and resolve
    interval: 1m
    input_series:
      - series: 'studytube_db_pool_waiting{job="studytube-api",instance="api-1"}'
        values: '2 2 2 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: StudyTubeDatabasePoolWaiters
        exp_alerts: []
      - eval_time: 2m
        alertname: StudyTubeDatabasePoolWaiters
        exp_alerts:
          - exp_labels:
              alertname: StudyTubeDatabasePoolWaiters
              instance: api-1
              job: studytube-api
              service: studytube
              severity: warning
            exp_annotations:
              summary: StudyTube database work is waiting for a connection
              action: Check slow requests and pool saturation before increasing capacity.
      - eval_time: 3m
        alertname: StudyTubeDatabasePoolWaiters
        exp_alerts: []

  - name: database pool saturation becomes pending, fires, and resolves
    interval: 1m
    input_series:
      - series: 'studytube_db_pool_connections{job="studytube-api",instance="api-1",state="busy"}'
        values: '9 9 9 2'
      - series: 'studytube_db_pool_connections{job="studytube-api",instance="api-1",state="total"}'
        values: '10 10 10 10'
    alert_rule_test:
      - eval_time: 1m
        alertname: StudyTubeDatabasePoolSaturation
        exp_alerts: []
      - eval_time: 2m
        alertname: StudyTubeDatabasePoolSaturation
        exp_alerts:
          - exp_labels:
              alertname: StudyTubeDatabasePoolSaturation
              instance: api-1
              job: studytube-api
              service: studytube
              severity: warning
            exp_annotations:
              summary: StudyTube database connection pool is saturated
              action: Inspect query latency and waiting work before changing the pool size.
      - eval_time: 3m
        alertname: StudyTubeDatabasePoolSaturation
        exp_alerts: []

  - name: bounded learning failures fire without private labels
    interval: 1m
    input_series:
      - series: 'studytube_learning_events_total{area="caption_stage",code="failed"}'
        values: '0 1 1'
      - series: 'studytube_learning_events_total{area="reservation",code="denied"}'
        values: '0 1 1'
      - series: 'studytube_learning_events_total{area="retrieval_mcp",code="failed"}'
        values: '0 1 1'
      - series: 'studytube_learning_events_total{area="stale_quiz",code="stale"}'
        values: '0 1 1'
      - series: 'studytube_learning_events_total{area="approval_conflict",code="version_conflict"}'
        values: '0 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: StudyTubeCaptionPipelineFailed
        exp_alerts:
          - exp_labels:
              alertname: StudyTubeCaptionPipelineFailed
              area: caption_stage
              code: failed
              service: studytube
              severity: warning
            exp_annotations:
              summary: StudyTube caption preparation failed
              action: Inspect the bounded caption stage code and sanitized worker logs.
      - eval_time: 2m
        alertname: StudyTubeReservationDenied
        exp_alerts:
          - exp_labels:
              alertname: StudyTubeReservationDenied
              area: reservation
              code: denied
              service: studytube
              severity: warning
            exp_annotations:
              summary: StudyTube learning cost reservation was denied
              action: Check configured count limits before changing any provider budget.
      - eval_time: 2m
        alertname: StudyTubeRetrievalMcpFailed
        exp_alerts:
          - exp_labels:
              alertname: StudyTubeRetrievalMcpFailed
              area: retrieval_mcp
              code: failed
              service: studytube
              severity: warning
            exp_annotations:
              summary: StudyTube grounded retrieval failed
              action: Inspect bounded MCP outcome codes without recording queries or source text.
      - eval_time: 2m
        alertname: StudyTubeQuizBecameStale
        exp_alerts:
          - exp_labels:
              alertname: StudyTubeQuizBecameStale
              area: stale_quiz
              code: stale
              service: studytube
              severity: info
            exp_annotations:
              summary: StudyTube quiz context became stale
              action: Confirm a fresh quiz can be generated from the current caption generation.
      - eval_time: 2m
        alertname: StudyTubeProposalApprovalConflict
        exp_alerts:
          - exp_labels:
              alertname: StudyTubeProposalApprovalConflict
              area: approval_conflict
              code: version_conflict
              service: studytube
              severity: info
            exp_annotations:
              summary: StudyTube Course approval conflicted
              action: Confirm the learner can refresh the Course choice or request a new proposal.
