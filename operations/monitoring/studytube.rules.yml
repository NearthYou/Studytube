groups:
  - name: studytube-runtime
    interval: 30s
    rules:
      - alert: StudyTubeOutboxBacklogOld
        expr: studytube_outbox_oldest_age_seconds > 120
        for: 2m
        labels:
          service: studytube
          severity: warning
        annotations:
          summary: StudyTube outbox delivery is delayed
          action: Inspect the outbox relay and oldest pending event before replaying work.

      - alert: StudyTubeOutboxProcessingFailures
        expr: increase(studytube_outbox_failures_total[5m]) > 0
        for: 1m
        labels:
          service: studytube
          severity: warning
        annotations:
          summary: StudyTube outbox processing failed
          action: Inspect bounded event-type metrics and sanitized worker logs.

      - alert: StudyTubeOutboxPoisonedEvent
        expr: increase(studytube_outbox_poison_total[5m]) > 0
        for: 1m
        labels:
          service: studytube
          severity: critical
        annotations:
          summary: StudyTube moved an outbox event to dead-letter storage
          action: Keep automatic replay disabled until the failure is classified.

      - alert: StudyTubeDatabasePoolWaiters
        expr: studytube_db_pool_waiting > 0
        for: 2m
        labels:
          service: studytube
          severity: warning
        annotations:
          summary: StudyTube database work is waiting for a connection
          action: Check slow requests and pool saturation before increasing capacity.

      - alert: StudyTubeDatabasePoolSaturation
        expr: >-
          studytube_db_pool_connections{state="busy"}
          / ignoring(state)
          clamp_min(studytube_db_pool_connections{state="total"}, 1)
          > 0.8
        for: 2m
        labels:
          service: studytube
          severity: warning
        annotations:
          summary: StudyTube database connection pool is saturated
          action: Inspect query latency and waiting work before changing the pool size.

      - alert: StudyTubeCaptionPipelineFailed
        expr: increase(studytube_learning_events_total{area="caption_stage",code="failed"}[10m]) > 0
        for: 1m
        labels:
          service: studytube
          severity: warning
        annotations:
          summary: StudyTube caption preparation failed
          action: Inspect the bounded caption stage code and sanitized worker logs.

      - alert: StudyTubeReservationDenied
        expr: increase(studytube_learning_events_total{area="reservation",code="denied"}[10m]) > 0
        for: 1m
        labels:
          service: studytube
          severity: warning
        annotations:
          summary: StudyTube learning cost reservation was denied
          action: Check configured count limits before changing any provider budget.

      - alert: StudyTubeRetrievalMcpFailed
        expr: increase(studytube_learning_events_total{area="retrieval_mcp",code="failed"}[10m]) > 0
        for: 1m
        labels:
          service: studytube
          severity: warning
        annotations:
          summary: StudyTube grounded retrieval failed
          action: Inspect bounded MCP outcome codes without recording queries or source text.

      - alert: StudyTubeQuizBecameStale
        expr: increase(studytube_learning_events_total{area="stale_quiz",code="stale"}[10m]) > 0
        for: 1m
        labels:
          service: studytube
          severity: info
        annotations:
          summary: StudyTube quiz context became stale
          action: Confirm a fresh quiz can be generated from the current caption generation.

      - alert: StudyTubeProposalApprovalConflict
        expr: increase(studytube_learning_events_total{area="approval_conflict",code=~"version_conflict|expired|rejected"}[10m]) > 0
        for: 1m
        labels:
          service: studytube
          severity: info
        annotations:
          summary: StudyTube Course approval conflicted
          action: Confirm the learner can refresh the Course choice or request a new proposal.
