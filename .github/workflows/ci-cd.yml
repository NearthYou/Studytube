name: CI/CD

on:
  pull_request:
    branches:
      - main
      - sw
  push:
    branches:
      - main
      - sw
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: node --test tests/*.test.ts

      - name: Build
        run: npm run build

  api:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app_test
      MIGRATION_ADOPTION_DATABASE: app_test
      NODE_ENV: test
      DB_INIT_ATTEMPTS: 3
      DB_INIT_RETRY_DELAY_MS: 100
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fresh migration install
        run: npm run db:migrate:up

      - name: Verify migration status
        run: npm run db:migrate:status

      - name: Verify idempotent demo seed
        env:
          ALLOW_DEMO_SEED: "true"
          DEMO_SEED_DATABASES: app_test
        run: |
          npm run db:seed
          npm run db:seed
          npm run db:seed:verify

      - name: Reset guarded legacy fixture
        env:
          ALLOW_LEGACY_FIXTURE_RESET: "true"
        run: npm run db:migrate:setup-legacy-fixture

      - name: Verify legacy adoption preserves data and writes
        env:
          ALLOW_MIGRATION_ADOPTION_TEST: "true"
        run: npm run db:migrate:test-adoption

      - name: Rehearse reversible concurrent-index migration
        env:
          PGPASSWORD: app
        run: |
          rollback_database=migration_rollback_test
          rollback_database_url="postgresql://app:${PGPASSWORD}@localhost:5432/${rollback_database}"
          cleanup_rollback_database() {
            dropdb --if-exists --host localhost --username app "$rollback_database"
          }
          trap cleanup_rollback_database EXIT
          cleanup_rollback_database
          createdb --host localhost --username app "$rollback_database"
          DATABASE_URL="$rollback_database_url" npm run db:migrate:up -- 2
          DATABASE_URL="$rollback_database_url" npm run db:migrate:down -- 1
          DATABASE_URL="$rollback_database_url" npm run db:migrate:up -- 1

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      - name: Test API with PostgreSQL
        run: npm run test:e2e

      - name: Build
        run: npm run build

  ai:
    name: AI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Test
        run: python -m unittest discover -s .

  deploy:
    name: Deploy EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - web
      - api
      - ai
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/sw')
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
      EC2_REPO_DIR: ${{ secrets.EC2_REPO_DIR }}
      DEPLOY_BRANCH: ${{ github.ref_name }}
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Prepare deployment config
        id: deploy-config
        run: |
          echo "EC2_HOST=${EC2_HOST:-15.164.98.162}" >> "$GITHUB_ENV"
          echo "EC2_USER=${EC2_USER:-ubuntu}" >> "$GITHUB_ENV"

          if [ -z "$EC2_SSH_KEY" ]; then
            echo "::notice::EC2_SSH_KEY is not configured, so deployment was skipped."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        if: steps.deploy-config.outputs.deploy == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy application
        if: steps.deploy-config.outputs.deploy == 'true'
        run: |
          REPO_DIR="${EC2_REPO_DIR:-/home/ubuntu/studytube}"
          APP_DIR="${EC2_APP_DIR:-$REPO_DIR}"
          ssh "$EC2_USER@$EC2_HOST" "REPO_DIR='$REPO_DIR' APP_DIR='$APP_DIR' DEPLOY_BRANCH='$DEPLOY_BRANCH' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$REPO_DIR"
          git fetch origin "$DEPLOY_BRANCH"
          fetched_sha="$(git rev-parse "origin/$DEPLOY_BRANCH")"
          if [ "$fetched_sha" != "$DEPLOY_SHA" ]; then
            echo "Refusing stale deployment: CI verified $DEPLOY_SHA but origin/$DEPLOY_BRANCH is $fetched_sha" >&2
            exit 1
          fi
          deploy_script="$(mktemp "${TMPDIR:-/tmp}/studytube-deploy.XXXXXX")"
          trap 'rm -f "$deploy_script"' EXIT
          git show "$DEPLOY_SHA:scripts/deploy-ec2.sh" >"$deploy_script"
          APP_DIR="$APP_DIR" DEPLOY_BRANCH="$DEPLOY_BRANCH" DEPLOY_SHA="$DEPLOY_SHA" bash "$deploy_script" "$DEPLOY_BRANCH"
          REMOTE
