<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">StudyTube 제품 방향</title>
  <desc id="desc">흩어진 영상 학습 도구를 하나의 흐름으로 묶어 학습 시작, 복습과 다음 학습을 잇는 제품 방향</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFF"/><stop offset="1" stop-color="#EEF4FF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E3A8A" flood-opacity="0.08"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/></marker>
    <style>
      text { font-family: Pretendard, "Noto Sans KR", "Segoe UI", sans-serif; fill:#0F172A; }
      .eyebrow { font-size:16px; font-weight:800; letter-spacing:2px; fill:#2563EB; }
      .title { font-size:40px; font-weight:850; letter-spacing:-1px; }
      .subtitle { font-size:18px; font-weight:500; fill:#64748B; }
      .number { font-size:15px; font-weight:850; fill:#2563EB; }
      .card-title { font-size:27px; font-weight:850; }
      .line { font-size:20px; font-weight:650; fill:#334155; }
      .result { font-size:20px; font-weight:700; fill:#FFFFFF; }
      .footer { font-size:17px; font-weight:700; fill:#475569; }
    </style>
  </defs>
  <rect width="1600" height="620" fill="#F8FAFF"/>
  <rect width="1600" height="620" rx="24" fill="url(#bg)"/>
  <text x="70" y="62" class="eyebrow">STUDYTUBE / PRODUCT DIRECTION</text>
  <text x="70" y="112" class="title">영상 학습을 다음 접속까지 이어 주는 서비스</text>
  <text x="70" y="146" class="subtitle">흩어져 있던 일을 하나의 학습 흐름으로 줄였습니다.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="205" width="410" height="285" rx="24" fill="#FFFFFF" stroke="#DCE5F3"/>
    <circle cx="112" cy="247" r="20" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="112" y="252" text-anchor="middle" class="number">01</text>
    <text x="148" y="255" class="card-title">문제</text>
    <text x="108" y="315" class="line">영상과 번역이 따로 있음</text>
    <text x="108" y="362" class="line">메모에 재생 시점이 남지 않음</text>
    <text x="108" y="409" class="line">다음 영상을 다시 검색해야 함</text>
  </g>

  <path d="M502 347 H555" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="575" y="205" width="450" height="285" rx="24" fill="#FFFFFF" stroke="#BFDBFE"/>
    <circle cx="617" cy="247" r="20" fill="#EEF2FF" stroke="#A5B4FC"/>
    <text x="617" y="252" text-anchor="middle" class="number">02</text>
    <text x="653" y="255" class="card-title">선택한 방식</text>
    <text x="613" y="315" class="line">원문부터 먼저 보여 주기</text>
    <text x="613" y="362" class="line">문장, 메모와 퀴즈를 시점에 묶기</text>
    <text x="613" y="409" class="line">코스 변경은 사용자가 결정하기</text>
  </g>

  <path d="M1047 347 H1100" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1120" y="205" width="410" height="285" rx="24" fill="#0F172A"/>
    <circle cx="1162" cy="247" r="20" fill="#2563EB"/>
    <text x="1162" y="252" text-anchor="middle" font-size="15" font-weight="850" style="fill:#FFFFFF">03</text>
    <text x="1198" y="255" class="card-title" style="fill:#FFFFFF">사용자 결과</text>
    <text x="1158" y="315" class="result">준비된 자막으로 바로 시작</text>
    <text x="1158" y="362" class="result">메모와 오답에서 장면으로 복습</text>
    <text x="1158" y="409" class="result">저장한 코스로 다음 학습 이어 보기</text>
  </g>

  <rect x="70" y="530" width="1460" height="54" rx="16" fill="#FFFFFF" stroke="#DCE5F3"/>
  <circle cx="105" cy="557" r="7" fill="#2563EB"/>
  <text x="126" y="563" class="footer">기준: 기다리지 않기, 시점을 잃지 않기, 관련 없는 영상을 억지로 채우지 않기</text>
</svg>
