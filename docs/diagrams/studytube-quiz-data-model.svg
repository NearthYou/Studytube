<path d="M910 240H845" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="877" y="225" class="label" text-anchor="middle">1 : 0..N</text>
<path d="M535 380V410H225V460" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="325" y="400" class="label" text-anchor="middle">1 : 0..N</text>
<path d="M660 380V460" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="710" y="425" class="label" text-anchor="middle">1 : 0..N</text>
<path d="M785 380V410H1095V460" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="1000" y="400" class="label" text-anchor="middle">1 : 0..1</text>
<path d="M410 565H475" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="442" y="550" class="label" text-anchor="middle">1 : 0..N</text>
<path d="M660 680V790" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="710" y="740" class="label" text-anchor="middle">1 : 0..N</text>
<path d="M1095 680V885H845" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="1070" y="870" class="label" text-anchor="middle">1 : 0..N</text>
<g><rect x="40" y="130" width="370" height="220" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><path d="M40 210H410" stroke="#cbd5e1"/><text x="58" y="162" class="name">study_contexts</text><text x="58" y="191" class="sub">학습 기록</text><text x="58" y="238" class="field">PK id</text><text x="58" y="265" class="field">user_id</text><text x="58" y="292" class="field">learning_item_id</text></g>
<g><rect x="475" y="130" width="370" height="250" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><path d="M475 210H845" stroke="#cbd5e1"/><text x="493" y="162" class="name">adaptive_quiz_loops</text><text x="493" y="191" class="sub">퀴즈 생성과 상태</text><text x="493" y="238" class="field">PK id</text><text x="493" y="265" class="field">FK study_context_id (composite)</text><text x="493" y="292" class="field">FK learning_item_id (composite)</text><text x="493" y="319" class="field">FK caption_artifact_id (composite)</text><text x="493" y="346" class="field">state / caption_generation</text></g>
<g><rect x="910" y="130" width="370" height="220" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><path d="M910 210H1280" stroke="#cbd5e1"/><text x="928" y="162" class="name">caption_artifacts</text><text x="928" y="191" class="sub">출제에 사용한 자막</text><text x="928" y="238" class="field">PK id</text><text x="928" y="265" class="field">video_source_id</text><text x="928" y="292" class="field">generation</text></g>
<g><rect x="40" y="460" width="370" height="220" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><path d="M40 540H410" stroke="#cbd5e1"/><text x="58" y="492" class="name">adaptive_quiz_evidence</text><text x="58" y="521" class="sub">문제별 자막 근거</text><text x="58" y="568" class="field">PK (loop_id, position)</text><text x="58" y="595" class="field">FK loop_id</text><text x="58" y="622" class="field">start_seconds / end_seconds</text><text x="58" y="649" class="field">content</text></g>
<g><rect x="475" y="460" width="370" height="220" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><path d="M475 540H845" stroke="#cbd5e1"/><text x="493" y="492" class="name">adaptive_quiz_questions</text><text x="493" y="521" class="sub">문제와 정답</text><text x="493" y="568" class="field">PK id</text><text x="493" y="595" class="field">FK loop_id</text><text x="493" y="622" class="field">FK (loop_id, evidence_position)</text><text x="493" y="649" class="field">prompt / correct_choice_index</text></g>
<g><rect x="910" y="460" width="370" height="220" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><path d="M910 540H1280" stroke="#cbd5e1"/><text x="928" y="492" class="name">adaptive_quiz_attempts</text><text x="928" y="521" class="sub">제출과 채점</text><text x="928" y="568" class="field">PK id</text><text x="928" y="595" class="field">FK loop_id (UNIQUE)</text><text x="928" y="622" class="field">score</text><text x="928" y="649" class="field">submitted_at</text></g>
<g><rect x="475" y="790" width="370" height="190" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/><path d="M475 870H845" stroke="#cbd5e1"/><text x="493" y="822" class="name">adaptive_quiz_answers</text><text x="493" y="851" class="sub">문제별 제출 답안</text><text x="493" y="898" class="field">PK (attempt_id, question_id)</text><text x="493" y="925" class="field">FK attempt_id / question_id</text><text x="493" y="952" class="field">selected_choice_index / correct</text></g>
<text x="40" y="1055" class="note">(composite)는 사용자, 영상 또는 자막 세대를 함께 확인하는 복합 외래 키입니다.</text>
<text x="40" y="1083" class="note">생성 중에는 문제와 근거가 없을 수 있습니다. 검증을 통과한 퀴즈는 구간별 1문제씩 총 5문제를 저장합니다.</text>
</svg>
