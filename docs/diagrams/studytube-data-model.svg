<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740" role="img" aria-labelledby="title desc">
  <title id="title">StudyTube 핵심 데이터 모델</title>
  <desc id="desc">사용자, 코스, 영상과 학습 맥락을 중심으로 자막, 메모, 진도와 퀴즈가 연결되는 관계</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFF"/><stop offset="1" stop-color="#EEF4FF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#1E3A8A" flood-opacity="0.08"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/></marker>
    <style>
      text { font-family: Pretendard, "Noto Sans KR", "Segoe UI", sans-serif; fill:#0F172A; }
      .eyebrow { font-size:16px; font-weight:800; letter-spacing:2px; fill:#2563EB; }
      .title { font-size:40px; font-weight:850; letter-spacing:-1px; }
      .subtitle { font-size:18px; font-weight:500; fill:#64748B; }
      .entity { font-size:23px; font-weight:850; }
      .meaning { font-size:17px; font-weight:650; fill:#64748B; }
      .relation { font-size:14px; font-weight:800; fill:#475569; }
      .note { font-size:17px; font-weight:700; fill:#475569; }
    </style>
  </defs>
  <rect width="1600" height="740" fill="#F8FAFF"/>
  <rect width="1600" height="740" rx="24" fill="url(#bg)"/>
  <text x="60" y="60" class="eyebrow">STUDYTUBE / CORE DATA MODEL</text>
  <text x="60" y="108" class="title">같은 영상도 사용자와 학습 맥락에 따라 따로 기록</text>
  <text x="60" y="142" class="subtitle">메모, 진도와 퀴즈는 영상 자체가 아니라 현재 학습 맥락에 연결됩니다.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="215" width="220" height="95" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="60" y="215" width="10" height="95" rx="5" fill="#0F172A"/>
    <text x="88" y="254" class="entity">users</text>
    <text x="88" y="282" class="meaning">계정과 학습 설정</text>
  </g>
  <path d="M290 262 H345" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="302" y="249" class="relation">1 : N</text>

  <g filter="url(#shadow)">
    <rect x="365" y="215" width="220" height="95" rx="18" fill="#FFFFFF" stroke="#BFDBFE"/>
    <rect x="365" y="215" width="10" height="95" rx="5" fill="#2563EB"/>
    <text x="393" y="254" class="entity">courses</text>
    <text x="393" y="282" class="meaning">저장한 학습 순서</text>
  </g>
  <path d="M595 262 H650" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="607" y="249" class="relation">1 : N</text>

  <g filter="url(#shadow)">
    <rect x="670" y="215" width="220" height="95" rx="18" fill="#FFFFFF" stroke="#C7D2FE"/>
    <rect x="670" y="215" width="10" height="95" rx="5" fill="#4F46E5"/>
    <text x="698" y="254" class="entity">course_steps</text>
    <text x="698" y="282" class="meaning">코스 안의 영상 한 단계</text>
  </g>
  <path d="M900 262 H955" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="912" y="249" class="relation">N : 1</text>

  <g filter="url(#shadow)">
    <rect x="975" y="215" width="220" height="95" rx="18" fill="#FFFFFF" stroke="#BAE6FD"/>
    <rect x="975" y="215" width="10" height="95" rx="5" fill="#0284C7"/>
    <text x="1003" y="254" class="entity">video_sources</text>
    <text x="1003" y="282" class="meaning">YouTube 영상 원본</text>
  </g>
  <path d="M1205 262 H1260" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1217" y="249" class="relation">1 : N</text>

  <g filter="url(#shadow)">
    <rect x="1280" y="215" width="260" height="95" rx="18" fill="#FFFFFF" stroke="#FBCFE8"/>
    <rect x="1280" y="215" width="10" height="95" rx="5" fill="#DB2777"/>
    <text x="1308" y="254" class="entity">caption_artifacts</text>
    <text x="1308" y="282" class="meaning">원문과 번역 자막의 세대</text>
  </g>

  <path d="M170 320 V390 H355" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="182" y="366" class="relation">1 : N</text>
  <path d="M1085 320 V365 H575 V390" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="375" y="405" width="240" height="100" rx="18" fill="#FFFFFF" stroke="#A5F3FC"/>
    <rect x="375" y="405" width="10" height="100" rx="5" fill="#0891B2"/>
    <text x="403" y="447" class="entity">learning_items</text>
    <text x="403" y="477" class="meaning">사용자와 영상의 고유 연결</text>
  </g>
  <path d="M625 455 H690" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="641" y="442" class="relation">1 : N</text>

  <g filter="url(#shadow)">
    <rect x="710" y="405" width="250" height="100" rx="18" fill="#FFFFFF" stroke="#DDD6FE"/>
    <rect x="710" y="405" width="10" height="100" rx="5" fill="#7C3AED"/>
    <text x="738" y="447" class="entity">study_contexts</text>
    <text x="738" y="477" class="meaning">단독 학습 또는 코스 학습</text>
  </g>
  <path d="M780 320 V395" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>

  <path d="M835 515 V545 H475 V570" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M835 515 V570" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M835 515 V545 H1195 V570" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="355" y="585" width="240" height="90" rx="18" fill="#FFFFFF" stroke="#E9D5FF"/>
    <rect x="355" y="585" width="10" height="90" rx="5" fill="#9333EA"/>
    <text x="383" y="623" class="entity">learning_notes</text>
    <text x="383" y="651" class="meaning">재생 시점이 붙은 메모</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="715" y="585" width="240" height="90" rx="18" fill="#FFFFFF" stroke="#BBF7D0"/>
    <rect x="715" y="585" width="10" height="90" rx="5" fill="#16A34A"/>
    <text x="743" y="623" class="entity">learning_progress</text>
    <text x="743" y="651" class="meaning">시청 범위와 마지막 위치</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1075" y="585" width="250" height="90" rx="18" fill="#FFFFFF" stroke="#FED7AA"/>
    <rect x="1075" y="585" width="10" height="90" rx="5" fill="#EA580C"/>
    <text x="1103" y="623" class="entity">adaptive_quiz</text>
    <text x="1103" y="651" class="meaning">자막 근거, 문제와 답안</text>
  </g>

  <rect x="60" y="696" width="1480" height="28" rx="14" fill="#0F172A"/>
  <text x="800" y="716" text-anchor="middle" font-size="14" font-weight="700" style="fill:#E2E8F0">학습 기록의 기준: study_contexts</text>
</svg>
