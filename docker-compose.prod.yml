services:
  ai:
    build:
      context: ./AI
    env_file:
      - ./.env.production
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend:
    build:
      context: ./backend
    env_file:
      - ./.env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      AI_SERVICE_URL: http://ai:8000
      UPLOAD_LOCAL_ROOT: /app/uploads
      UPLOAD_LOCAL_ROOT_IS_PERSISTENT: "true"
      UPLOAD_STORAGE_DRIVER: local
    volumes:
      - backend_uploads:/app/uploads
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_KAKAO_MAP_JS_KEY: ${VITE_KAKAO_MAP_JS_KEY:-}
        VITE_ENABLED_SOCIAL_PROVIDERS: ${VITE_ENABLED_SOCIAL_PROVIDERS:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  backend_uploads:
